<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日复盘</title>
<link rel="stylesheet" href="src/renderer/styles/summary.css">
</head>
<body>

<div class="wrap" id="wrap">
  <header>
    <div id="dateLine">—</div>
    <h1 id="titleLine"><span data-icon="journal"></span><span class="title-text">今日复盘</span></h1>
    <button id="closeBtn" class="closeBtn" type="button" aria-label="关闭"><span data-icon="close"></span></button>
  </header>

  <div class="recap" id="recapCard"></div>

  <div class="skipCard" id="skipCard"></div>

  <button id="editDayBtn" class="linkBtn"><span data-icon="edit"></span><span class="button-text">编辑时间块</span></button>

  <section class="field">
    <label id="lbHeadline">一句话形容今天</label>
    <input id="headline" type="text" maxlength="60" autocomplete="off">
  </section>

  <section class="field">
    <label id="lbMood">今日心情</label>
    <div id="moodRow"></div>
  </section>

  <section class="field">
    <label id="lbRating">今日自评</label>
    <div id="starRow"></div>
  </section>

  <section class="field">
    <label><span id="lbTags">给今天贴个标签</span><span class="sub" id="tagSub"></span></label>
    <div id="tagRow"></div>
    <div class="tagAdd">
      <input id="tagInput" maxlength="12">
      <button id="tagAddBtn" aria-label="添加标签"><span data-icon="add"></span></button>
    </div>
  </section>

  <section class="field">
    <label id="lbGood">今天做得好的</label>
    <textarea id="good" rows="3"></textarea>
  </section>

  <section class="field">
    <label id="lbImprove">可以改进的</label>
    <textarea id="improve" rows="3"></textarea>
  </section>

  <section class="field">
    <label id="lbPlan">明天想做的</label>
    <textarea id="planT" rows="3"></textarea>
  </section>

  <footer>
    <button id="laterBtn">稍后再说</button>
    <button id="saveBtn" disabled>保存今日总结</button>
  </footer>
</div>

<div id="savedMask">
  <div class="big"><span data-icon="done"></span></div>
  <div class="txt" id="savedTxt">已保存</div>
</div>

<script src="src/renderer/shared/namespace.js"></script>
<script src="src/renderer/shared/icons.js"></script>
<script src="src/renderer/shared/date-utils.js"></script>
<script src="src/renderer/shared/dom-utils.js"></script>
<script src="src/renderer/shared/state-schema.js"></script>
<script src="src/renderer/shared/state-client.js"></script>
<script src="src/renderer/shared/schedule-model.js"></script>
<script src="src/renderer/shared/stats-model.js"></script>
<script src="src/renderer/shared/skip-model.js"></script>
<script src="src/renderer/summary/app.js"></script>
</body>
</html>
